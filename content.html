<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content — Sinners</title>
  <meta name="description" content="Watch YouTube videos and playlists while you wait for a stream to start.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0c0a0d">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sinners">
  <meta property="og:title" content="Content — Sinners">
  <meta property="og:description" content="Watch YouTube videos and playlists while you wait for a stream to start.">
  <meta property="og:url" content="https://sinnerstv.com/content">
  <meta property="og:image" content="https://sinnerstv.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://sinnerstv.com/og-image.png">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="/" class="logo"><span class="logo-mark" aria-hidden="true">S</span><span>SINNERS<span class="logo-dot">.</span></span></a>
      <nav>
        <ul id="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/watch">Watch</a></li>
          <li><a href="/content" aria-current="page">Content</a></li>
          <li><a href="/gallery">Gallery</a></li>
          <li><a href="/about">About</a></li>
        </ul>
      </nav>
      <div class="nav-actions" id="nav-actions"></div>
      <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container reveal">
        <h1>While You <span class="gradient-text">Wait</span></h1>
        <p>Watch YouTube while the stream is starting or on a break.</p>
      </div>
    </section>

    <section class="section" style="padding-top:24px">
      <div class="container wide content-layout">
        <div class="content-main">
          <div class="player-box content-player" id="content-player">
            <div class="player-offline">Add a YouTube video or playlist to start watching.</div>
          </div>
          <div class="content-bar">
            <button class="icon-action" id="prev" type="button" aria-label="Previous video" title="Previous">⏮</button>
            <button class="icon-action" id="next" type="button" aria-label="Next video" title="Next">⏭</button>
            <button class="icon-action" id="mini" type="button" aria-label="Mini player" title="Mini player">⧉</button>
            <div class="content-now">
              <small>Now playing</small>
              <strong id="now-playing">Nothing yet</strong>
            </div>
          </div>
        </div>

        <aside class="content-side">
          <form class="add-form" id="content-form" autocomplete="off">
            <h3>Add to your queue</h3>
            <div class="add-row">
              <input id="content-input" type="text" placeholder="YouTube video or playlist link" aria-label="YouTube video or playlist link">
              <button class="button" type="submit">Add</button>
            </div>
            <p class="form-msg" id="content-msg" role="status"></p>
          </form>

          <div class="side-box">
            <div class="side-head">
              <h3>Your queue</h3>
              <button class="link-btn" id="clear-queue" type="button">Clear</button>
            </div>
            <ol class="queue" id="queue"></ol>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Sinners</p>
      <p><a href="/watch">Watch</a><a href="/content">Content</a><a href="/gallery">Gallery</a><a href="/about">About</a></p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="alerts.js"></script>
  <script src="chat.js"></script>
  <script src="mini.js"></script>
  <script src="nav.js"></script>
</body>
</html>
